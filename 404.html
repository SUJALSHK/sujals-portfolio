<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1020" />
    <title>Page Not Found | Sujal Shakya</title>
    <link rel="icon" href="/sujals-portfolio/assets/icons/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        display: grid;
        place-items: center;
        color: #f9fafb;
        background:
          radial-gradient(circle at 70% 18%, rgba(56, 189, 248, 0.18), transparent 35rem),
          linear-gradient(180deg, #151b2c, #03050c);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(42rem, 100%);
        padding: clamp(2rem, 6vw, 4rem);
        border: 1px solid rgba(56, 189, 248, 0.24);
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.82);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .code { color: #39ff14; font-size: 1rem; font-weight: 800; letter-spacing: 0.2em; }
      h1 { margin: 1rem 0; font-size: clamp(2rem, 8vw, 3.75rem); }
      p { margin: 0 auto; color: #cbd5e1; font-size: 1.05rem; line-height: 1.8; }
      a {
        min-height: 3rem;
        margin-top: 2rem;
        padding: 0.8rem 1.25rem;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #07111f;
        background: #39ff14;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        The page may have moved or the address may be incorrect. Return to the
        portfolio homepage to keep exploring.
      </p>
      <a href="/sujals-portfolio/">Back to Sujal's Portfolio</a>
    </main>
  </body>
</html>
